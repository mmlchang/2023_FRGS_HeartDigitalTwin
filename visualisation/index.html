    <title>VisHeart - 17 Segment Visualisation</title>

  <body>
    <div id="mainContainer">   
      <div id="chartContainer">
        <div id="AHAContainer">
          <h3>Cardiac 17 Segment Plot (Radial Strain)</h3>
          <canvas id="AHAPlot"></canvas>
        </div>
        <div id="colorBarContainer">
          <p> </p>
          <div id="HeatMapScale">
            <div><p>-10%</p> </div>
            <div><p>45%</p> </div>
          </div>
          <div id="colorBar"></div>
        </div> 
      </div>
      <div id="heartContainer">
        <h3>3D Heart Model</h3>
        <div id="heartCanvas"></div>
      </div>
    </div>

    <script type="module" src="src/assign-color.js"></script>
    
    <script type="module" src="src/main.js"></script>
